name: Tests
on:
  workflow_dispatch: 
#  push:
#    branches: main
#  pull_request:
#    branches: main

jobs:
  test:
    name: Testing with GdUnit4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          paths: "res://scripts/tests"
          dotnet-version: net10.0 # will probably fail here
          godot-net: true
          # godot-force-mono: true
          version: latest
          upload-report: true
          
